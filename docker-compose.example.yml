x-common:
  database:
    &db-environment
    # Do not remove the "&db-password" from the end of the line below, it is important
    # for Panel functionality.
    MYSQL_PASSWORD: &db-password "change_me"
    MYSQL_ROOT_PASSWORD: "change_me_root"
  panel:
    &panel-environment
    APP_URL: "http://example.com"
    # A list of valid timezones can be found here: http://php.net/manual/en/timezones.php
    APP_TIMEZONE: "UTC"
    APP_SERVICE_AUTHOR: "noreply@example.com"
    # Uncomment the line below and set to a non-empty value if you want to use Let's Encrypt
    # to generate an SSL certificate for the Panel.
    # LE_EMAIL: ""
  # The mail settings are not part of the environment any more. They are stored in
  # the database and edited from Admin -> Settings -> Mail.

#
# ------------------------------------------------------------------------------------------
# DANGER ZONE BELOW
#
# The remainder of this file likely does not need to be changed. Please only make modifications
# below if you understand what you are doing.
#
services:
  database:
    image: mariadb:11
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - zozpanel
    volumes:
      - "/srv/zozpanel/database:/var/lib/mysql"
    environment:
      <<: *db-environment
      MYSQL_DATABASE: "zozpanel_docker"
      MYSQL_USER: "zozpanel_docker"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:alpine
    restart: always
    networks:
      - zozpanel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  panel:
    image: ghcr.io/pms-technology/zozpanel:latest
    restart: always
    networks:
      - zozpanel
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - "/srv/zozpanel/var/:/app/var/"
      - "/srv/zozpanel/nginx/:/etc/nginx/http.d/"
      - "/srv/zozpanel/certs/:/etc/letsencrypt/"
      - "/srv/zozpanel/logs/:/app/storage/logs"
      - "./.github/docker/supervisord.conf:/etc/supervisord.conf"
      - "./.github/docker/entrypoint.sh:/entrypoint.sh"
    environment:
      <<: *panel-environment
      DB_PASSWORD: *db-password
      DB_USERNAME: "zozpanel_docker"
      DB_DATABASE: "zozpanel_docker"
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"
      HASHIDS_LENGTH: 8
networks:
  zozpanel:
    ipam:
      config:
        - subnet: 172.20.0.0/16
