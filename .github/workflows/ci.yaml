name: Tests

on:
  push:
    branches:
      - "develop"
      - "3.x-develop"
  pull_request:
    branches:
      - "develop"
      - "3.x-develop"

jobs:
  tests:
    name: PHP
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        database: ["mariadb:10.2", "mysql:8"]
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306
    steps:
      - uses: actions/checkout@v4
      - id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, cli, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - run: cp .env.ci .env
      - run: composer install --no-interaction --no-progress --no-suggest --prefer-dist
      # The pages served by the Svelte bundle are rendered through Vite, which reads
      # the manifest of the built frontend. Without the build there is no manifest
      # and every page that uses the bundle answers 500.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Restore frontend build
        id: frontend-build
        uses: actions/cache@v4
        with:
          path: public/build-svelte
          key: ${{ runner.os }}-svelte-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Build frontend
        if: steps.frontend-build.outputs.cache-hit != 'true'
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpunit --bootstrap vendor/autoload.php tests/Unit
        env:
          DB_HOST: UNIT_NO_DB
      - run: vendor/bin/phpunit tests/Integration
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root